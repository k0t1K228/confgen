* Пример 3 (торговля): заказ интернет-магазина с расчётом итога.
{{!
  Скидка равна десятой части суммы, но не больше предела;
  налог начисляется на сумму после скидки.
}}
let shopName = @"Книжный мир"
let bookPrice = 1.5e3
let taxRate = 2.5e-1
let subtotal = ^[bookPrice * 2e0 + 5e1 * 1e1]
let discount = ^[min(1e3, subtotal / 1e1)]
let total = ^[(subtotal - discount) * (1e0 + taxRate)]

begin
  store := ^[shopName];
  items := #(
    begin title := @"Книга"; price := ^[bookPrice]; quantity := 2e0; end,
    begin title := @"Закладка"; price := 5e1; quantity := 1e1; end
  );
  subtotal := ^[subtotal];
  discount := ^[discount];
  total := ^[total];
end
