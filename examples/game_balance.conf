* Пример 2 (разработка игр): баланс персонажей и врагов.
{{! Бонус героя хранится отдельной константой-словарём. }}
let baseHealth = 1e2
let baseDamage = 1.5e1
let levelBonus = begin
  health := 2e1;
  damage := 5e0;
end

begin
  hero := begin
    health := ^[baseHealth + 5e1];
    damage := ^[baseDamage * 2e0];
    skills := #(@"Удар", @"Блок", @"Рывок");
    bonus := ^[levelBonus];
  end;
  enemies := #(
    begin
      kind := @"Гоблин";
      health := ^[baseHealth / 2e0];
    end,
    begin
      kind := @"Тролль";
      health := ^[baseHealth * 3e0 - 5e1];
      damage := ^[min(baseDamage * 2e0, 2.5e1)];
    end
  );
  waves := #(#(1e0, 2e0), #(3e0, ^[1e0 + 4e0]), #());
end
