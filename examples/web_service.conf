* Пример 1 (администрирование): конфигурация веб-сервиса.
{{!
  Порты, число процессов и лимиты выводятся из базовых констант,
  поэтому для смены окружения достаточно поправить let-объявления.
}}
let basePort = 8e3
let workers = 4e0
let memoryMb = 5.12e2
let serviceName = @"shop-api"

begin
  name := ^[serviceName];
  port := ^[basePort + 8e1];
  adminPort := ^[basePort + 9e1];
  workerCount := ^[workers * 2e0];
  memoryPerWorkerMb := ^[memoryMb / workers];
  limits := begin
    maxConnections := ^[workers * 1e2];
    timeoutSeconds := ^[min(3e1, 6e1 / 2e0 + 5e0)];
  end;
  hosts := #(@"api.example.com", @"backup.example.com");
end
